<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國小數學素養閱讀題生成器 - 簡易隨機版</title>
<meta name="description" content="自動生成與自訂簡易版國小數學素養閱讀連鎖題，數字限制在100以內，計算僅含加減乘除且可整除，支援動態隨機出題、A4排版列印與一鍵複製。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ========================================================
   設計令牌 Design Tokens
   ======================================================== */
:root {
  --bg-dark: #0a0f1d;
  --bg-panel: #141c32;
  --bg-card: #1e2945;
  --accent: #ff4757;
  --accent-hover: #ff6b81;
  --green: #2ed573;
  --green-hover: #26af5f;
  --blue: #1e90ff;
  --text-light: #f1f2f6;
  --text-muted: #a4b0be;
  --border: #2e3e60;
  --radius: 12px;
  --shadow: 0 12px 40px rgba(0,0,0,0.5);
  --print-accent: #c0392b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ========================================================
   儀表板標題 Dashboard Header
   ======================================================== */
.dashboard-header {
  background: var(--bg-panel);
  border-bottom: 2px solid var(--accent);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}

.dashboard-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.dashboard-title h1 {
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: 0.05em;
}

.dashboard-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  background: rgba(255, 71, 87, 0.1);
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid rgba(255, 71, 87, 0.2);
}

/* ========================================================
   主版面結構 (左右分欄)
   ======================================================== */
.main-layout {
  display: flex;
  flex: 1;
  gap: 28px;
  padding: 28px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

/* 側邊參數控制欄 */
.config-panel {
  width: 360px;
  flex-shrink: 0;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  height: fit-content;
  position: sticky;
  top: 100px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.config-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.config-section-title {
  font-size: 0.95rem;
  font-weight: 900;
  color: var(--accent);
  border-bottom: 2px solid var(--border);
  padding-bottom: 8px;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 輸入控件與滑桿 */
.control-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-label-group {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
}

select {
  background: #090e1a;
  color: var(--text-light);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
  width: 100%;
}
select:focus { border-color: var(--accent); }

.slider-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

.slider-container input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}

.slider-value {
  font-family: monospace;
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  min-width: 32px;
  text-align: right;
}

/* 隨機變數對照表 */
.var-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
  font-size: 0.8rem;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 8px;
  overflow: hidden;
}

.var-table th, .var-table td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

.var-table th {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  font-weight: 700;
}

.var-table tr:last-child td {
  border-bottom: none;
}

.var-badge {
  display: inline-block;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: monospace;
  font-weight: 700;
  color: #ffb86c;
}

/* 按鈕樣式 */
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.1s, filter 0.2s, background-color 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #fff;
  width: 100%;
}
.btn:active { transform: scale(0.97); }
.btn-gen { background: linear-gradient(135deg, var(--accent), #ff6b81); }
.btn-gen:hover { filter: brightness(1.1); }
.btn-print { background: linear-gradient(135deg, var(--green), #26af5f); }
.btn-print:hover { filter: brightness(1.1); }
.btn-copy { background: var(--bg-card); border: 1px solid var(--border); font-size: 0.8rem; padding: 8px 12px; }
.btn-copy:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--text-muted); }

/* ========================================================
   A4 紙張排版預覽 PREVIEW
   ======================================================== */
.preview-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
  flex: 1;
}

.a4-page {
  background: #fff;
  color: #111;
  width: 210mm;
  height: 297mm;
  padding: 15mm 15mm;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.page-header {
  text-align: center;
  margin-bottom: 8px;
}
.page-header h2 {
  font-size: 1.35rem;
  font-weight: 900;
  letter-spacing: 0.05em;
  margin: 0;
  color: #111;
}

.student-info-bar {
  display: flex;
  justify-content: space-between;
  border-top: 3px solid #111;
  border-bottom: 3px solid #111;
  padding: 6px 4px;
  margin-bottom: 14px;
  font-weight: 700;
  font-size: 0.95rem;
}

/* 故事閱讀框 */
.passage-card {
  border: 2.5px solid #222;
  border-radius: 8px;
  background: #fdfdfa;
  padding: 16px 20px;
  margin-bottom: 14px;
  line-height: 1.7;
  font-size: 0.92rem;
  text-align: justify;
}

.passage-title {
  font-weight: 900;
  font-size: 1.05rem;
  margin-bottom: 8px;
  color: #c0392b;
  border-bottom: 2px solid #c0392b;
  padding-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 題目清單 */
.question-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  flex: 1;
}

.question-item {
  border: 1px solid #dfe6e9;
  border-radius: 8px;
  padding: 12px 16px;
  background: #fcfcfc;
  font-size: 0.95rem;
  line-height: 1.5;
}

.question-text {
  font-weight: 700;
}

.question-label {
  font-weight: 900;
  color: #c0392b;
}

.answer-space {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  border-top: 1px dashed #dfe6e9;
  padding-top: 8px;
  margin-top: 8px;
  font-weight: 700;
}

.answer-box {
  border: 2px solid #111;
  border-radius: 6px;
  min-width: 140px;
  height: 28px;
  margin-left: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
}

/* 答案卷專屬樣式 */
.answer-page {
  display: none;
}
.answer-page .answer-box {
  color: var(--print-accent);
  border-color: var(--print-accent);
  font-weight: 900;
  font-size: 0.95rem;
}
.answer-page .student-info-bar {
  border-color: var(--print-accent);
  color: var(--print-accent);
}

/* ========================================================
   列印與響應式排版
   ======================================================== */
@media (max-width: 1024px) {
  .main-layout {
    flex-direction: column;
    padding: 16px;
    gap: 20px;
  }
  .config-panel {
    width: 100%;
    position: static;
  }
  .preview-container {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 20px;
  }
  .a4-page {
    flex-shrink: 0;
  }
}

@media print {
  .dashboard-header, .config-panel { display: none !important; }
  body { background: #fff; overflow: visible; }
  .main-layout { padding: 0; margin: 0; max-width: none; width: auto; display: block; }
  .preview-container { padding: 0; gap: 0; display: block; }
  .a4-page {
    box-shadow: none;
    margin: 0;
    width: 210mm;
    height: 297mm;
    page-break-after: always;
    float: none;
  }
  .answer-page { display: flex !important; }
  .page-header h2, .question-label, .passage-title { color: var(--print-accent) !important; border-color: var(--print-accent) !important; }
}
</style>
</head>
<body>

<!-- 頂部控制列 -->
<header class="dashboard-header">
  <div class="dashboard-title">
    <h1>📐 數學素養連鎖題產生器</h1>
    <span class="dashboard-subtitle">低中年級簡易版</span>
  </div>
</header>

<!-- 主排版區 -->
<main class="main-layout">
  
  <!-- 側邊自訂與操作面板 -->
  <aside class="config-panel" id="config-panel">
    
    <!-- 題目設定區 -->
    <div class="config-section">
      <div class="config-section-title">📋 題目設定</div>
      
      <div class="control-item">
        <div class="control-label-group">
          <span>情境故事主題</span>
        </div>
        <select id="story-select" onchange="generate()">
          <option value="random">🎲 隨機情境故事</option>
          <option value="farm">🚜 快樂農場水果採收</option>
          <option value="fair">🎪 愛心園遊會冷飲攤</option>
          <option value="recycling">♻️ 資源回收換貼紙</option>
          <option value="bakery">🍞 美味烘焙坊出爐</option>
          <option value="library">📚 星空圖書館挑戰</option>
          <option value="stationery">✏️ 歡樂文具店採購</option>
          <option value="sports">🏃 學校趣味運動會</option>
          <option value="castle">🏰 積木城堡玩具拼裝</option>
        </select>
      </div>

      <div class="control-item">
        <div class="control-label-group">
          <span>數字上限值限制</span>
          <span class="slider-value" id="max-value-display">100</span>
        </div>
        <div class="slider-container">
          <input type="range" id="max-value-slider" min="30" max="100" step="5" value="100" oninput="updateSliderVal(this.value)" onchange="generate()">
        </div>
      </div>
    </div>

    <!-- 變數檢視器 -->
    <div class="config-section">
      <div class="config-section-title">🔍 當前數值對照表 (皆≤百位)</div>
      <table class="var-table">
        <thead>
          <tr>
            <th>變數</th>
            <th>說明</th>
            <th>數值</th>
          </tr>
        </thead>
        <tbody id="var-table-body">
          <!-- 動態填充 -->
        </tbody>
      </table>
    </div>

    <!-- 操作按鈕 -->
    <div class="config-section">
      <button class="btn btn-gen" onclick="generate()">⚡ 重新隨機生成</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ 列印 A4 (題目+答案)</button>
    </div>

    <!-- 複製工具 -->
    <div class="config-section">
      <div class="config-section-title">📂 複製工具</div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-copy" onclick="copyText('q')" style="flex: 1;">📋 複製題目</button>
        <button class="btn btn-copy" onclick="copyText('a')" style="flex: 1;">📋 複製答案</button>
      </div>
    </div>

  </aside>

  <!-- A4 預覽區 -->
  <section class="preview-container">
    
    <!-- 題目卷 -->
    <article class="a4-page" id="question-sheet">
      <div class="page-header"><h2 id="q-sheet-title">數學素養閱讀挑戰卷</h2></div>
      <div class="student-info-bar">
        <span>姓名：___________</span>
        <span id="date-string">日期：____年____月____日</span>
        <span>得分：___________</span>
      </div>
      <div class="passage-card" id="q-passage-container"></div>
      <div class="question-list" id="q-list-container"></div>
    </article>

    <!-- 答案卷 -->
    <article class="a4-page answer-page" id="answer-sheet">
      <div class="page-header"><h2 id="a-sheet-title">【答案卷】批改對照用</h2></div>
      <div class="student-info-bar" style="border-color: var(--print-accent); color: var(--print-accent);">
        <span>教師批改專用 — 請勿發給學生</span>
      </div>
      <div class="passage-card" id="a-passage-container"></div>
      <div class="question-list" id="a-list-container"></div>
    </article>

  </section>

</main>

<script>
'use strict';

// 產生指定範圍的隨機整數
function rng(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 隨機打亂陣列
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 八大故事主題庫 (每個情境故事字數精準設定在 450~500 字左右，最符合小學生閱讀難度)
const stories = [
  {
    id: "farm",
    title: "快樂農場水果採收",
    icon: "🚜",
    vars_desc: {
      A: "水果總收穫量",
      B: "運送碰撞受損量",
      Q1: "好水果淨重量 (A - B)",
      C: "每袋分裝重量",
      Q2: "包裝分裝袋數 (Q1 ÷ C)",
      D: "每袋出售價格",
      Q3: "出售總收入款 (Q2 × D)",
      E: "平分獎金人數",
      Q4: "每人分得獎金 (Q3 ÷ E)"
    },
    genRandom(maxVal) {
      for (let i = 0; i < 2000; i++) {
        const C = rng(2, 8);
        const E = rng(2, 5);
        const Q2 = rng(3, Math.floor(maxVal / C));
        const Q1 = Q2 * C;
        const B = rng(2, 20);
        const A = Q1 + B;
        
        const D = rng(2, Math.floor(maxVal / Q2));
        const Q3 = Q2 * D;
        if (Q3 % E === 0) {
          const Q4 = Q3 / E;
          if (A <= maxVal && B <= maxVal && C <= maxVal && D <= maxVal && E <= maxVal &&
              Q1 <= maxVal && Q2 <= maxVal && Q3 <= maxVal && Q4 <= maxVal) {
            return { A, B, C, D, E, Q1, Q2, Q3, Q4 };
          }
        }
      }
      return null;
    },
    getPassage(p) {
      return `在翠綠群山環繞的綠谷深處，有一座歷史修久且非常有名的「快樂農場」。這裡一年四季氣候溫和，陽光充足，種植出來的水果都格外清甜多汁。每到夏天採收季節，總會吸引許多盤商前來搶購。為了避開中午炎熱的高溫，果園主人王伯伯在清晨五點鐘就召集了當地的村民和志工，推著推車分工合作進行大規模的水果採收工作。大家一邊唱歌一邊辛勤勞動，一共採收了 ${p.A}公斤的水果。然而，在將水果載回倉庫的運送過程中，因為山路路面有些凹凸不平，導致貨車有些劇烈顛簸，結果有 ${p.B}公斤的水果碰撞受損，實在是無法進行正常販售。為維持農場的優良品質，王伯伯計劃把剩餘能出售的優良水果進行整理與分裝，規定每 ${p.C}公斤裝成一袋來出貨。下午時分，長期合作的林老闆開著貨車前來採購，決定以每袋 ${p.D}元的價格向王伯伯全數買下所有裝袋好的水果。交易完成後，王伯伯覺得大家今天都非常辛苦，決定把這筆賣出水果的所有收入，平分給包含他自己在內的 ${p.E}位工作人員作為特別獎金。請根據上述文章的資訊回答下列問題：`;
    },
    solve(p) {
      return [
        { q: "王伯伯採收的水果中，可以包裝販售的好水果共有多少公斤？", ans: `${p.Q1} 公斤` },
        { q: "承上題，這些優質水果一共可以包裝成多少袋？(未滿一袋不計)", ans: `${p.Q2} 袋` },
        { q: "承上題，林老闆買下所有包裝好的水果，王伯伯共可收到多少元？", ans: `${p.Q3} 元` },
        { q: "承上題，平分下來每位工作人員可以分得多少元獎金？", ans: `${p.Q4} 元` }
      ];
    }
  },
  {
    id: "fair",
    title: "愛心園遊會冷飲攤",
    icon: "🎪",
    vars_desc: {
      A: "準備紅茶杯數",
      B: "準備綠茶杯數",
      Q1: "特調茶飲總杯數 (A + B)",
      C: "每盒裝入杯數",
      Q2: "包裝成盒子袋數 (Q1 ÷ C)",
      D: "每盒特調售價",
      Q3: "全部售出總收入 (Q2 × D)",
      E: "購買吸管紙盒成本",
      Q4: "最後存入基金 (Q3 - E)"
    },
    genRandom(maxVal) {
      for (let i = 0; i < 2000; i++) {
        const A = rng(10, 40);
        const B = rng(10, 40);
        const Q1 = A + B;
        const C = rng(2, 8);
        if (Q1 % C === 0) {
          const Q2 = Q1 / C;
          const D = rng(2, Math.floor(maxVal / Q2));
          const Q3 = Q2 * D;
          const E = rng(5, Math.min(35, Q3 - 2));
          const Q4 = Q3 - E;
          if (A <= maxVal && B <= maxVal && C <= maxVal && D <= maxVal && E <= maxVal &&
              Q1 <= maxVal && Q2 <= maxVal && Q3 <= maxVal && Q4 <= maxVal) {
            return { A, B, C, D, E, Q1, Q2, Q3, Q4 };
          }
        }
      }
      return null;

      Q4: "特價購買實付金額 (Q3 - E)"
    },
    genRandom(maxVal) {
      for (let i = 0; i < 2000; i++) {
        const A = rng(10, 40);
        const B = rng(10, 40);
        const Q1 = A + B;
        const C = rng(2, 6);
        if (Q1 % C === 0) {
          const Q2 = Q1 / C;
          const D = rng(2, Math.floor(maxVal / Q2));
          const Q3 = Q2 * D;
          const E = rng(2, Math.min(25, Q3 - 2));
          const Q4 = Q3 - E;
          if (A <= maxVal && B <= maxVal && C <= maxVal && D <= maxVal && E <= maxVal &&
              Q1 <= maxVal && Q2 <= maxVal && Q3 <= maxVal && Q4 <= maxVal) {
            return { A, B, C, D, E, Q1, Q2, Q3, Q4 };
          }
        }
      }
      return null;
    },
    getPassage(p) {
      return `創意積木俱樂部的隊員們下午聚在活動教室裡，準備一起組裝最新款的科幻積木城堡大模型。這項拼裝任務需要極大的耐心與團隊合作，大家在圓桌上分類整理，經過篩選，一共準備了 ${p.A}個藍色積木和 ${p.B}個紅色積木。另外，桌上還散落著 20個黃色積木和 15個綠色積木，但因顏色不符，因此不列入拼裝。隊員們決定將這些選好的藍色與紅色積木混在一起，並平均分配，合力組裝成 ${p.C}個一模一樣的科幻大城堡模型。根據積木社的標記規則，每一個小積木折算的基礎價值是 ${p.D}元，因此每個組裝好的城堡模型都會有其相應的基礎售價。今天剛好配合學校的玩具展發表活動，若有其他班級的顧客想要當場買走這些組裝好的城堡模型，可以享有攤位特別的促銷折價優惠，買每一個城堡模型都可以當場現減免折抵 ${p.E}元，剩下的部分就是顧客需要實付的特惠金額，所有收入將捐給社區孤兒院。請根據上述文章回答下列問題：`;
    },
    solve(p) {
      return [
        { q: "隊員們組裝城堡模型，總共準備了多少個積木？", ans: `${p.Q1} 個` },
        { q: "承上題，若將積木平分組裝，每個大城堡模型使用多少個積木？", ans: `${p.Q2} 個` },
        { q: "承上題，若依積木單個折算價值計算，每個城堡模型的基礎售價是多少元？", ans: `${p.Q3} 元` },
        { q: "承上題，配合玩具展促銷活動，顧客買一個折價後的城堡實際應付多少元？", ans: `${p.Q4} 元` }
      ];
    }
  }
];

let activeStory = null;
let activeParams = null;

// 更新滑動條數值顯示
function updateSliderVal(val) {
  document.getElementById('max-value-display').textContent = val;
}

// 出題與渲染核心
function generate() {
  const selectVal = document.getElementById('story-select').value;
  const maxVal = parseInt(document.getElementById('max-value-slider').value);
  
  if (selectVal === 'random') {
    const idx = Math.floor(Math.random() * stories.length);
    activeStory = stories[idx];
  } else {
    activeStory = stories.find(s => s.id === selectVal);
  }

  if (!activeStory) return;

  // 使用數學驗證器動態搜尋參數
  activeParams = activeStory.genRandom(maxVal);

  if (!activeParams) {
    // 萬一因上限極小導致搜尋失敗，自動調寬上限值重新嘗試
    activeParams = activeStory.genRandom(100);
  }

  renderUI();
}

// 渲染 A4 及儀表板對照表
function renderUI() {
  if (!activeStory || !activeParams) return;

  // 1. 渲染左側變數表格
  const tableBody = document.getElementById('var-table-body');
  tableBody.innerHTML = '';
  Object.keys(activeStory.vars_desc).forEach(key => {
    const desc = activeStory.vars_desc[key];
    const val = activeParams[key];
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><span class="var-badge">${key}</span></td>
      <td style="color: var(--text-muted); font-size:0.75rem;">${desc}</td>
      <td style="font-family: monospace; font-weight: 700; color: #2ed573;">${val}</td>
    `;
    tableBody.appendChild(row);
  });

  // 2. 填入日期
  const today = new Date();
  document.getElementById('date-string').textContent = `日期：${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;

  // 3. 更新標題
  const titleText = `數學素養閱讀挑戰卷 - ${activeStory.title}`;
  document.getElementById('q-sheet-title').textContent = titleText;
  document.getElementById('a-sheet-title').textContent = `【答案卷】${activeStory.title}`;

  // 4. 取得本文與解答
  const passage = activeStory.getPassage(activeParams);
  const solvedQuestions = activeStory.solve(activeParams);

  // 5. 渲染本文
  const passageHtml = `<div class="passage-title">${activeStory.icon} 閱讀主題：${activeStory.title}</div><div>${passage}</div>`;
  document.getElementById('q-passage-container').innerHTML = passageHtml;
  document.getElementById('a-passage-container').innerHTML = passageHtml;

  // 6. 渲染連鎖問題
  let qHtml = '';
  let aHtml = '';

  solvedQuestions.forEach((item, index) => {
    qHtml += `
      <div class="question-item">
        <div class="question-text"><span class="question-label">問題 ${index + 1}：</span>${item.q}</div>
        <div class="answer-space">答：<div class="answer-box"></div></div>
      </div>`;

    aHtml += `
      <div class="question-item">
        <div class="question-text"><span class="question-label">問題 ${index + 1}：</span>${item.q}</div>
        <div class="answer-space">答：<div class="answer-box">${item.ans}</div></div>
      </div>`;
  });

  document.getElementById('q-list-container').innerHTML = qHtml;
  document.getElementById('a-list-container').innerHTML = aHtml;
}

// 複製到剪貼簿功能
function copyText(type) {
  if (!activeStory || !activeParams) return;
  
  let text = '';
  const passage = activeStory.getPassage(activeParams);
  const solvedQuestions = activeStory.solve(activeParams);

  if (type === 'q') {
    text += `【題目卷】數學素養閱讀挑戰 - ${activeStory.title}\n\n`;
    text += `文章閱讀：\n${passage}\n\n`;
    solvedQuestions.forEach((item, i) => {
      text += `問題 ${i + 1}：${item.q}\n答：__________________\n\n`;
    });
  } else {
    text += `【答案卷】數學素養閱讀挑戰 - ${activeStory.title}\n\n`;
    solvedQuestions.forEach((item, i) => {
      text += `問題 ${i + 1}：${item.q}\n答：${item.ans}\n\n`;
    });
  }

  navigator.clipboard.writeText(text).then(() => {
    alert('複製成功！可以直接貼入 Word 中使用。');
  }).catch(() => {
    alert('您的瀏覽器不支援一鍵複製，請手動圈選內容複製。');
  });
}

// 初始化
window.onload = generate;
</script>
