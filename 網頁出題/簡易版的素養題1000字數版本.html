<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國小數學素養閱讀題生成器 - 簡易隨機版</title>
<meta name="description" content="自動生成與自訂簡易版國小數學素養閱讀連鎖題，數字限制在100以內，計算僅含加減乘除且可整除，支援動態隨機出題、A4排版列印與一鍵複製。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ========================================================
   設計令牌 Design Tokens
   ======================================================== */
:root {
  --bg-dark: #0a0f1d;
  --bg-panel: #141c32;
  --bg-card: #1e2945;
  --accent: #ff4757;
  --accent-hover: #ff6b81;
  --green: #2ed573;
  --green-hover: #26af5f;
  --blue: #1e90ff;
  --text-light: #f1f2f6;
  --text-muted: #a4b0be;
  --border: #2e3e60;
  --radius: 12px;
  --shadow: 0 12px 40px rgba(0,0,0,0.5);
  --print-accent: #c0392b;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--bg-dark);
  color: var(--text-light);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  overflow-x: hidden;
}

/* ========================================================
   儀表板標題 Dashboard Header
   ======================================================== */
.dashboard-header {
  background: var(--bg-panel);
  border-bottom: 2px solid var(--accent);
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 100;
}

.dashboard-title {
  display: flex;
  align-items: center;
  gap: 10px;
}

.dashboard-title h1 {
  font-size: 1.35rem;
  font-weight: 900;
  color: var(--accent);
  letter-spacing: 0.05em;
}

.dashboard-subtitle {
  font-size: 0.8rem;
  color: var(--text-muted);
  background: rgba(255, 71, 87, 0.1);
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid rgba(255, 71, 87, 0.2);
}

/* ========================================================
   主版面結構 (左右分欄)
   ======================================================== */
.main-layout {
  display: flex;
  flex: 1;
  gap: 28px;
  padding: 28px;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}

/* 側邊參數控制欄 */
.config-panel {
  width: 360px;
  flex-shrink: 0;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  height: fit-content;
  position: sticky;
  top: 100px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.config-section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.config-section-title {
  font-size: 0.95rem;
  font-weight: 900;
  color: var(--accent);
  border-bottom: 2px solid var(--border);
  padding-bottom: 8px;
  letter-spacing: 0.05em;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 輸入控件與滑桿 */
.control-item {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-label-group {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
}

select {
  background: #090e1a;
  color: var(--text-light);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
  width: 100%;
}
select:focus { border-color: var(--accent); }

.slider-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

.slider-container input[type="range"] {
  flex: 1;
  accent-color: var(--accent);
  cursor: pointer;
}

.slider-value {
  font-family: monospace;
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent);
  min-width: 32px;
  text-align: right;
}

/* 隨機變數對照表 */
.var-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 6px;
  font-size: 0.8rem;
  background: rgba(0, 0, 0, 0.2);
  border-radius: 8px;
  overflow: hidden;
}

.var-table th, .var-table td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}

.var-table th {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  font-weight: 700;
}

.var-table tr:last-child td {
  border-bottom: none;
}

.var-badge {
  display: inline-block;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: monospace;
  font-weight: 700;
  color: #ffb86c;
}

/* 按鈕樣式 */
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: var(--radius);
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.1s, filter 0.2s, background-color 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #fff;
  width: 100%;
}
.btn:active { transform: scale(0.97); }
.btn-gen { background: linear-gradient(135deg, var(--accent), #ff6b81); }
.btn-gen:hover { filter: brightness(1.1); }
.btn-print { background: linear-gradient(135deg, var(--green), #26af5f); }
.btn-print:hover { filter: brightness(1.1); }
.btn-copy { background: var(--bg-card); border: 1px solid var(--border); font-size: 0.8rem; padding: 8px 12px; }
.btn-copy:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--text-muted); }

/* ========================================================
   A4 紙張排版預覽 PREVIEW
   ======================================================== */
.preview-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 36px;
  flex: 1;
}

.a4-page {
  background: #fff;
  color: #111;
  width: 210mm;
  height: 297mm;
  padding: 12mm 15mm;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}

.page-header {
  text-align: center;
  margin-bottom: 8px;
}
.page-header h2 {
  font-size: 1.35rem;
  font-weight: 900;
  letter-spacing: 0.05em;
  margin: 0;
  color: #111;
}

.student-info-bar {
  display: flex;
  justify-content: space-between;
  border-top: 3px solid #111;
  border-bottom: 3px solid #111;
  padding: 6px 4px;
  margin-bottom: 14px;
  font-weight: 700;
  font-size: 0.95rem;
}

/* 故事閱讀框 */
.passage-card {
  border: 2.5px solid #222;
  border-radius: 8px;
  background: #fdfdfa;
  padding: 14px 18px;
  margin-bottom: 14px;
  line-height: 1.6;
  font-size: 0.88rem;
  text-align: justify;
}

.passage-title {
  font-weight: 900;
  font-size: 1rem;
  margin-bottom: 6px;
  color: #c0392b;
  border-bottom: 2px solid #c0392b;
  padding-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 題目清單 */
.question-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}

.question-item {
  border: 1px solid #dfe6e9;
  border-radius: 8px;
  padding: 10px 14px;
  background: #fcfcfc;
  font-size: 0.9rem;
  line-height: 1.5;
}

.question-text {
  font-weight: 700;
}

.question-label {
  font-weight: 900;
  color: #c0392b;
}

.answer-space {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  border-top: 1px dashed #dfe6e9;
  padding-top: 6px;
  margin-top: 6px;
  font-weight: 700;
}

.answer-box {
  border: 2px solid #111;
  border-radius: 6px;
  min-width: 140px;
  height: 26px;
  margin-left: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
}

/* 答案卷專屬樣式 */
.answer-page {
  display: none;
}
.answer-page .answer-box {
  color: var(--print-accent);
  border-color: var(--print-accent);
  font-weight: 900;
  font-size: 0.9rem;
}
.answer-page .student-info-bar {
  border-color: var(--print-accent);
  color: var(--print-accent);
}

/* ========================================================
   列印與響應式排版
   ======================================================== */
@media (max-width: 1024px) {
  .main-layout {
    flex-direction: column;
    padding: 16px;
    gap: 20px;
  }
  .config-panel {
    width: 100%;
    position: static;
  }
  .preview-container {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 20px;
  }
  .a4-page {
    flex-shrink: 0;
  }
}

@media print {
  .dashboard-header, .config-panel { display: none !important; }
  body { background: #fff; overflow: visible; }
  .main-layout { padding: 0; margin: 0; max-width: none; width: auto; display: block; }
  .preview-container { padding: 0; gap: 0; display: block; }
  .a4-page {
    box-shadow: none;
    margin: 0;
    width: 210mm;
    height: 297mm;
    page-break-after: always;
    float: none;
  }
  .answer-page { display: flex !important; }
  .page-header h2, .question-label, .passage-title { color: var(--print-accent) !important; border-color: var(--print-accent) !important; }
}
</style>
</head>
<body>

<!-- 頂部控制列 -->
<header class="dashboard-header">
  <div class="dashboard-title">
    <h1>📐 數學素養連鎖題產生器</h1>
    <span class="dashboard-subtitle">低中年級簡易版</span>
  </div>
</header>

<!-- 主排版區 -->
<main class="main-layout">
  
  <!-- 側邊自訂與操作面板 -->
  <aside class="config-panel" id="config-panel">
    
    <!-- 題目設定區 -->
    <div class="config-section">
      <div class="config-section-title">📋 題目設定</div>
      
      <div class="control-item">
        <div class="control-label-group">
          <span>情境故事主題</span>
        </div>
        <select id="story-select" onchange="generate()">
          <option value="random">🎲 隨機情境故事</option>
          <option value="farm">🚜 快樂農場水果採收</option>
          <option value="fair">🎪 愛心園遊會冷飲攤</option>
          <option value="recycling">♻️ 資源回收換貼紙</option>
          <option value="bakery">🍞 美味烘焙坊出爐</option>
          <option value="library">📚 星空圖書館挑戰</option>
          <option value="stationery">✏️ 歡樂文具店採購</option>
          <option value="sports">🏃 學校趣味運動會</option>
          <option value="castle">🏰 積木城堡玩具拼裝</option>
        </select>
      </div>

      <div class="control-item">
        <div class="control-label-group">
          <span>數字上限值限制</span>
          <span class="slider-value" id="max-value-display">100</span>
        </div>
        <div class="slider-container">
          <input type="range" id="max-value-slider" min="30" max="100" step="5" value="100" oninput="updateSliderVal(this.value)" onchange="generate()">
        </div>
      </div>
    </div>

    <!-- 變數檢視器 -->
    <div class="config-section">
      <div class="config-section-title">🔍 當前數值對照表 (皆≤百位)</div>
      <table class="var-table">
        <thead>
          <tr>
            <th>變數</th>
            <th>說明</th>
            <th>數值</th>
          </tr>
        </thead>
        <tbody id="var-table-body">
          <!-- 動態填充 -->
        </tbody>
      </table>
    </div>

    <!-- 操作按鈕 -->
    <div class="config-section">
      <button class="btn btn-gen" onclick="generate()">⚡ 重新隨機生成</button>
      <button class="btn btn-print" onclick="window.print()">🖨️ 列印 A4 (題目+答案)</button>
    </div>

    <!-- 複製工具 -->
    <div class="config-section">
      <div class="config-section-title">📂 複製工具</div>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-copy" onclick="copyText('q')" style="flex: 1;">📋 複製題目</button>
        <button class="btn btn-copy" onclick="copyText('a')" style="flex: 1;">📋 複製答案</button>
      </div>
    </div>

  </aside>

  <!-- A4 預覽區 -->
  <section class="preview-container">
    
    <!-- 題目卷 -->
    <article class="a4-page" id="question-sheet">
      <div class="page-header"><h2 id="q-sheet-title">數學素養閱讀挑戰卷</h2></div>
      <div class="student-info-bar">
        <span>姓名：___________</span>
        <span id="date-string">日期：____年____月____日</span>
        <span>得分：___________</span>
      </div>
      <div class="passage-card" id="q-passage-container"></div>
      <div class="question-list" id="q-list-container"></div>
    </article>

    <!-- 答案卷 -->
    <article class="a4-page answer-page" id="answer-sheet">
      <div class="page-header"><h2 id="a-sheet-title">【答案卷】批改對照用</h2></div>
      <div class="student-info-bar" style="border-color: var(--print-accent); color: var(--print-accent);">
        <span>教師批改專用 — 請勿發給學生</span>
      </div>
      <div class="passage-card" id="a-passage-container"></div>
      <div class="question-list" id="a-list-container"></div>
    </article>

  </section>

</main>

<script>
'use strict';

// 產生指定範圍的隨機整數
function rng(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// 隨機打亂陣列
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// 八大故事主題庫 (每個情境故事字數擴展至 1000 字左右，全面考驗學童對於長文資訊的篩選與閱讀能力)
const stories = [
  {
    id: "farm",
    title: "快樂農場水果採收",
    icon: "🚜",
    vars_desc: {
      A: "水果總收穫量",
      B: "運送碰撞受損量",
      Q1: "好水果淨重量 (A - B)",
      C: "每袋分裝重量",
      Q2: "包裝分裝袋數 (Q1 ÷ C)",
      D: "每袋出售價格",
      Q3: "出售總收入款 (Q2 × D)",
      E: "平分獎金人數",
      Q4: "每人分得獎金 (Q3 ÷ E)"
    },
    genRandom(maxVal) {
      for (let i = 0; i < 2000; i++) {
        const C = rng(2, 8);
        const E = rng(2, 5);
        const Q2 = rng(3, Math.floor(maxVal / C));
        const Q1 = Q2 * C;
        const B = rng(2, 20);
        const A = Q1 + B;
        
        const D = rng(2, Math.floor(maxVal / Q2));
        const Q3 = Q2 * D;
        if (Q3 % E === 0) {
          const Q4 = Q3 / E;
          if (A <= maxVal && B <= maxVal && C <= maxVal && D <= maxVal && E <= maxVal &&
              Q1 <= maxVal && Q2 <= maxVal && Q3 <= maxVal && Q4 <= maxVal) {
            return { A, B, C, D, E, Q1, Q2, Q3, Q4 };
          }
        }
      }
      return null;
    },
    getPassage(p) {
      return `在翠綠群山環繞的世外桃源綠谷深處，有一座歷史悠久且聞名遐邇的「快樂農場」。這裡一年四季氣候溫和，陽光充足，且擁有從雪山上流淌下來的清澈甘甜水源，非常適合種植各種高品質的高山水果。農場主人王伯伯已經經營這片果園超過二十年了，他始終堅持使用最天然的有機施肥方式，絕不噴灑化學農藥，因此這裡培育出來的水果皮薄肉厚、清甜多汁。每到夏秋採收季節，總會吸引全台各地的水果中盤商開著大貨車前來爭相訂購，在市場上可謂供不應求。

今年夏天，果園裡的果樹結滿了沉甸甸的果實，微風吹過，傳來陣陣熟透的水果香氣。王伯伯看著滿園的碩果，臉上露出了無比欣慰的笑容。為了避開中午炎熱的高溫，王伯伯在清晨五點鐘天剛朦朧亮的時候就召集了當地的村民和熱心的假日志工。大家戴上草帽、套上手套，推著防震小推車，分工合作進行大規模的水果採收工作。果園裡迴盪著大家歡快的歌聲與笑聲，雖然額頭上掛滿汗水，但每個人都樂在其中。經過一整個上午的辛勤勞動，他們一共採收了 ${p.A}公斤的水果。

然而，令人擔憂的挑戰在運送過程中發生了。從採收的果園到山底下的包裝出貨倉庫，必須經過一條長約三公里的陡峭碎石山路。今天負責開貨車的年輕司機小李雖然開得非常小心翼翼，但由於前幾天下大雨導致路面凹凸不平、碎石遍佈，貨車在下山時不可避免地產生了劇烈的顛簸與震動。當車子終於抵達倉庫時，王伯伯仔細清點檢查，無奈地發現其中有 ${p.B}公斤的水果因為嚴重的碰撞而受損，果皮裂開且流出果汁，實在無法擺上架進行正常販售。為了維護快樂農場長期以來的優良信譽，王伯伯當即決定將這些受損的水果挑選出來做成天然肥料，絕不賣給顧客。

下午，陽光透過樹葉灑下斑駁的光影，大家開始在陰涼的樹蔭下進行剩餘優質水果的整理與分裝工作。王伯伯規定，必須使用透氣防潮的環保紙袋，將能出售的優質水果每 ${p.C}公斤裝成一袋，每一袋都要經過精密電子秤秤重，確保分量足夠。另外，果園旁今天也採收了 120公斤的李子和 50公斤的桃子，但這些水果尚未進行清洗與品質篩選，因此暫時堆放在倉庫角落，不列入本次的蘋果包裝出貨計畫中。

就在包裝工作接近尾聲時，長期合作的中盤商林老闆開著他的藍色大貨車準時前來。林老闆在仔細抽樣檢查了幾袋水果後，對其甜度和外觀讚不絕口，當場決定以每袋 ${p.D}元的售價，向王伯伯買下今天所有裝袋好的優質水果。交易完成後，林老闆用現金支付了貨款。王伯伯拿著這筆沉甸甸的現金，心裡非常感激大家的辛勞付出，他決定扣除包材的雜支後，將這筆賣出水果的所有收入平分給包含他自己在內的 ${p.E}位工作人員，作為今天的特別加班獎金。請根據上述文章的詳細資訊，回答下列問題：`;
    },
    solve(p) {
      return [
        { q: "王伯伯採收的水果中，可以包裝販售的好水果共有多少公斤？", ans: `${p.Q1} 公斤` },

let activeStory = null;
let activeParams = null;

// 更新滑動條數值顯示
function updateSliderVal(val) {
  document.getElementById('max-value-display').textContent = val;
}

// 出題與渲染核心
function generate() {
  const selectVal = document.getElementById('story-select').value;
  const maxVal = parseInt(document.getElementById('max-value-slider').value);
  
  if (selectVal === 'random') {
    const idx = Math.floor(Math.random() * stories.length);
    activeStory = stories[idx];
  } else {
    activeStory = stories.find(s => s.id === selectVal);
  }

  if (!activeStory) return;

  // 使用數學驗證器動態搜尋參數
  activeParams = activeStory.genRandom(maxVal);

  if (!activeParams) {
    // 萬一因上限極小導致搜尋失敗，自動調寬上限值重新嘗試
    activeParams = activeStory.genRandom(100);
  }

  renderUI();
}

// 渲染 A4 及儀表板對照表
function renderUI() {
  if (!activeStory || !activeParams) return;

  // 1. 渲染左側變數表格
  const tableBody = document.getElementById('var-table-body');
  tableBody.innerHTML = '';
  Object.keys(activeStory.vars_desc).forEach(key => {
    const desc = activeStory.vars_desc[key];
    const val = activeParams[key];
    const row = document.createElement('tr');
    row.innerHTML = `
      <td><span class="var-badge">${key}</span></td>
      <td style="color: var(--text-muted); font-size:0.75rem;">${desc}</td>
      <td style="font-family: monospace; font-weight: 700; color: #2ed573;">${val}</td>
    `;
    tableBody.appendChild(row);
  });

  // 2. 填入日期
  const today = new Date();
  document.getElementById('date-string').textContent = `日期：${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;

  // 3. 更新標題
  const titleText = `數學素養閱讀挑戰卷 - ${activeStory.title}`;
  document.getElementById('q-sheet-title').textContent = titleText;
  document.getElementById('a-sheet-title').textContent = `【答案卷】${activeStory.title}`;

  // 4. 取得本文與解答
  const passage = activeStory.getPassage(activeParams);
  const solvedQuestions = activeStory.solve(activeParams);

  // 5. 渲染本文
  const passageHtml = `<div class="passage-title">${activeStory.icon} 閱讀主題：${activeStory.title}</div><div>${passage}</div>`;
  document.getElementById('q-passage-container').innerHTML = passageHtml;
  document.getElementById('a-passage-container').innerHTML = passageHtml;

  // 6. 渲染連鎖問題
  let qHtml = '';
  let aHtml = '';

  solvedQuestions.forEach((item, index) => {
    qHtml += `
      <div class="question-item">
        <div class="question-text"><span class="question-label">問題 ${index + 1}：</span>${item.q}</div>
        <div class="answer-space">答：<div class="answer-box"></div></div>
      </div>`;

    aHtml += `
      <div class="question-item">
        <div class="question-text"><span class="question-label">問題 ${index + 1}：</span>${item.q}</div>
        <div class="answer-space">答：<div class="answer-box">${item.ans}</div></div>
      </div>`;
  });

  document.getElementById('q-list-container').innerHTML = qHtml;
  document.getElementById('a-list-container').innerHTML = aHtml;
}

  if (!activeStory || !activeParams) return;
  
  let text = '';
  const passage = activeStory.getPassage(activeParams);
  const solvedQuestions = activeStory.solve(activeParams);

  if (type === 'q') {
    text += `【題目卷】數學素養閱讀挑戰 - ${activeStory.title}\n\n`;
    text += `文章閱讀：\n${passage}\n\n`;
    solvedQuestions.forEach((item, i) => {
      text += `問題 ${i + 1}：${item.q}\n答：__________________\n\n`;
    });
  } else {
    text += `【答案卷】數學素養閱讀挑戰 - ${activeStory.title}\n\n`;
    solvedQuestions.forEach((item, i) => {
      text += `問題 ${i + 1}：${item.q}\n答：${item.ans}\n\n`;
    });
  }

  navigator.clipboard.writeText(text).then(() => {
    alert('複製成功！可以直接貼入 Word 中使用。');
  }).catch(() => {
    alert('您的瀏覽器不支援一鍵複製，請手動圈選內容複製。');
  });
}

// 初始化
window.onload = generate;
</script>
</body>
</html>
